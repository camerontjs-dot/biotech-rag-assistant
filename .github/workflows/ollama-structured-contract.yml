name: Ollama structured adapter contract

on:
  pull_request:
    paths:
      - "src/biotech_rag_assistant/ollama_generator.py"
      - "src/biotech_rag_assistant/generation.py"
      - "src/biotech_rag_assistant/evidence_packet.py"
      - "tests/test_ollama_generator.py"
      - "research/check_ollama_structured_contract.py"
      - ".github/workflows/ollama-structured-contract.yml"
  workflow_dispatch:

jobs:
  qualify:
    name: qualify structured Ollama adapter without network
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run focused adapter tests
        run: |
          pytest -q tests/test_ollama_generator.py tests/test_generation_boundary_pressure.py

      - name: Emit adapter contract receipt
        run: |
          mkdir -p build/research/ollama-structured
          python research/check_ollama_structured_contract.py             | tee build/research/ollama-structured/receipt.json

      - name: Upload adapter contract receipt
        uses: actions/upload-artifact@v4
        with:
          name: ollama-structured-adapter-contract
          path: build/research/ollama-structured/receipt.json
          if-no-files-found: error
