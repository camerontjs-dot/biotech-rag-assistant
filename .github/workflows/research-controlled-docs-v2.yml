name: controlled-docs-v2 Slice 2 evaluator

on:
  pull_request:
    paths:
      - "research/controlled-docs-v2-*"
      - "research/controlled_docs_v2_slice2.py"
      - "benchmarks/controlled-docs-v2/**"
      - ".github/workflows/research-controlled-docs-v2.yml"
  workflow_dispatch:

jobs:
  discriminate:
    name: benchmark discrimination
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and research dependency
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r research/controlled-docs-v2-requirements.txt

      - name: Run preregistered Slice 2 evaluator
        id: evaluator
        shell: bash
        run: |
          set +e
          python research/controlled_docs_v2_slice2.py             --benchmark benchmarks/controlled-docs-v2             --out build/research/controlled-docs-v2
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload first-run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-docs-v2-slice2-reports
          path: build/research/controlled-docs-v2/
          if-no-files-found: error

      - name: Enforce Slice 2 gate after preserving reports
        shell: bash
        run: |
          test "${{ steps.evaluator.outputs.exit_code }}" -eq 0
