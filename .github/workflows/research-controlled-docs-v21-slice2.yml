name: controlled-docs-v2.1 Slice 2 discriminator

on:
  pull_request:
    paths:
      - "benchmarks/controlled-docs-v2.1/**"
      - "research/controlled_docs_v21_slice2.py"
      - "research/controlled-docs-v2.1-requirements.txt"
      - "research/controlled-docs-v2.1-slice2-protocol.md"
      - ".github/workflows/research-controlled-docs-v21-slice2.yml"
  workflow_dispatch:

jobs:
  discriminate:
    name: frozen v2.1 benchmark discrimination
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify frozen benchmark identity
        run: |
          python research/verify_controlled_docs_v21_freeze.py             --benchmark benchmarks/controlled-docs-v2.1

      - name: Install package and unchanged dense-control dependency
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r research/controlled-docs-v2.1-requirements.txt

      - name: Run preregistered Slice 2 discriminator
        id: evaluator
        shell: bash
        run: |
          set +e
          python research/controlled_docs_v21_slice2.py             --benchmark benchmarks/controlled-docs-v2.1             --out build/research/controlled-docs-v2.1-slice2
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload first-run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-docs-v2.1-slice2-first-run
          path: build/research/controlled-docs-v2.1-slice2/
          if-no-files-found: error

      - name: Enforce Slice 2 disposition after preserving reports
        shell: bash
        run: |
          test "${{ steps.evaluator.outputs.exit_code }}" -eq 0
