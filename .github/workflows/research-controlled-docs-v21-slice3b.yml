name: controlled-docs-v2.1 Slice 3B DEV challengers

on:
  workflow_dispatch:

jobs:
  dev-challengers:
    name: DEV reranking and cross-reference challengers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify frozen benchmark identity
        run: |
          python research/verify_controlled_docs_v21_freeze.py             --benchmark benchmarks/controlled-docs-v2.1

      - name: Install package and pinned retrieval dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r research/controlled-docs-v2.1-slice3a-requirements.txt

      - name: Run DEV-only Slice 3B
        run: |
          mkdir -p build/research/controlled-docs-v2.1-slice3b
          python research/controlled_docs_v21_slice3b.py             --benchmark benchmarks/controlled-docs-v2.1             --out build/research/controlled-docs-v2.1-slice3b

      - name: Upload DEV challenger report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-docs-v2.1-slice3b-dev
          path: build/research/controlled-docs-v2.1-slice3b/
          if-no-files-found: error
