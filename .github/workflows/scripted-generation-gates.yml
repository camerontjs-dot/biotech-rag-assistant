name: Scripted generation gate qualification

on:
  pull_request:
    paths:
      - "src/biotech_rag_assistant/generation.py"
      - "tests/test_generation_gates.py"
      - "research/check_scripted_generation_gates.py"
      - ".github/workflows/scripted-generation-gates.yml"
  workflow_dispatch:

jobs:
  qualify:
    name: qualify G1-G7 scripted adversaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run scripted gate qualification
        run: |
          mkdir -p build/research/generation-gates
          python research/check_scripted_generation_gates.py             | tee build/research/generation-gates/receipt.json

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripted-generation-gates-receipt
          path: build/research/generation-gates/receipt.json
          if-no-files-found: error
