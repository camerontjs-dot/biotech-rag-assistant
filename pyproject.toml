[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biotech-rag-assistant"
version = "0.1.0"
description = "A controlled-document retrieval pilot for synthetic regulated-industry document sets."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["retrieval", "rag", "provenance", "controlled-documents", "traceability"]
authors = [
    { name = "Cameron Sanderson" },
]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1,<9",
    "fastapi>=0.110,<1",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "rank-bm25>=0.2.2,<0.3",
    "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.0,<10",
    "ruff>=0.15,<1",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
biotech-rag = "biotech_rag_assistant.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
